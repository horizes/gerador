<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperium — Gerador de Propostas</title>
<meta name="description" content="Ferramenta interna da Imperium Terceirização e Serviços para gerar propostas comerciais.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A09">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="m-edit">
<div class="tabs">
  <button data-tab="edit" class="on">Configurar</button>
  <button data-tab="prev">Visualizar</button>
</div>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="stage">
    <div class="stagebar">
      <div class="zoom">Pré-visualização A4</div>
      <div>
        <button id="zout">−</button><button id="zin">+</button>
        <button id="print">Imprimir / salvar PDF</button>
      </div>
    </div>
    <div class="papers" id="papers"></div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
