<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperium — Plataforma</title>
<meta name="description" content="Plataforma interna da Imperium Terceirização e Serviços.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A09">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/auth.css?v=2">
<link rel="stylesheet" href="css/platform.css?v=6">
<link rel="stylesheet" href="css/propostas.css?v=2">
<link rel="stylesheet" href="css/fluxo.css?v=3">
<link rel="stylesheet" href="css/dashboard.css?v=3">
<link rel="stylesheet" href="css/usuarios.css?v=3">
<link rel="stylesheet" href="css/uniformes.css?v=2">
</head>
<body>

<div class="login-wrap" id="login" style="display:none">
  <form class="login-box" id="loginForm" autocomplete="on">
    <img src="assets/logo.jpg" alt="" class="login-logo">
    <h1>Imperium</h1>
    <p class="login-sub">Entre com seu e-mail e senha para acessar</p>
    <label class="f"><span>E-mail</span><input type="email" id="loginEmail" required autocomplete="username"></label>
    <label class="f"><span>Senha</span><input type="password" id="loginSenha" required autocomplete="current-password"></label>
    <label class="login-keep"><input type="checkbox" id="loginManter" checked><span>Manter conectado</span></label>
    <p class="login-erro" id="loginErro" hidden></p>
    <button class="btn wide" type="submit">Entrar</button>
    <button class="btn ghost wide" type="button" id="loginEsqueci">Esqueci minha senha</button>
  </form>
</div>

<div class="shell is-open" id="shell" style="display:none">

  <header class="mobbar">
    <button class="mb-menu" id="menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="mb-brand" href="#/"><img src="assets/logo.jpg" alt=""><b>Imperium</b></a>
  </header>

  <aside class="side" id="side">
    <div class="side-in">
      <a class="sd-brand" href="#/" aria-label="Imperium — início">
        <img src="assets/logo.jpg" alt="">
        <span><b>Imperium</b><small>Plataforma</small></span>
      </a>
      <nav class="sd-nav" id="nav" aria-label="Principal"></nav>
      <button class="sd-item sd-toggle" id="sidetoggle" type="button" aria-pressed="true">
        <span class="sd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 6l-6 6 6 6"/></svg></span>
        <span class="sd-lbl">Recolher menu</span>
      </button>
      <button class="sd-item sd-sair" id="sairBtn" type="button">
        <span class="sd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
        <span class="sd-lbl">Sair</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="viewwrap"><div id="view"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/perfil.js?v=2"></script>
<script src="js/dashboard.js?v=3"></script>
<script src="js/platform.js?v=8"></script>
<script src="js/modules/propostas.js?v=3"></script>
<script src="js/modules/fluxo.js?v=5"></script>
<script src="js/modules/uniformes.js?v=2"></script>
<script src="js/modules/usuarios.js?v=4"></script>
<script src="js/auth.js?v=4"></script>
</body>
</html>
