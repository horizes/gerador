<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Imperium — Plataforma</title>
<meta name="description" content="Plataforma interna da Imperium Terceirização e Serviços.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0A0A09">
<link rel="icon" href="assets/icons/icon-192.png" type="image/png">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Imperium">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css?v=2">
<link rel="stylesheet" href="css/auth.css?v=4">
<link rel="stylesheet" href="css/platform.css?v=16">
<link rel="stylesheet" href="css/propostas.css?v=26">
<link rel="stylesheet" href="css/fluxo.css?v=4">
<link rel="stylesheet" href="css/dashboard.css?v=3">
<link rel="stylesheet" href="css/usuarios.css?v=5">
<link rel="stylesheet" href="css/uniformes.css?v=7">
<link rel="stylesheet" href="css/home.css?v=1">
<link rel="stylesheet" href="css/ponto.css?v=2">
<link rel="stylesheet" href="css/clientes-relatorios.css?v=6">
<link rel="stylesheet" href="css/push.css?v=1">
</head>
<body>

<div class="login-wrap" id="login" style="display:none">
  <form class="login-box" id="loginForm" autocomplete="on">
    <img src="assets/logo.jpg" alt="" class="login-logo">
    <h1>Imperium</h1>
    <p class="login-sub">Entre com seu e-mail e senha para acessar</p>
    <label class="f"><span>E-mail</span><input type="email" id="loginEmail" required autocomplete="username"></label>
    <label class="f"><span>Senha</span><input type="password" id="loginSenha" required autocomplete="current-password"></label>
    <label class="login-keep"><input type="checkbox" id="loginManter" checked><span>Manter conectado</span></label>
    <p class="login-erro" id="loginErro" hidden></p>
    <button class="btn wide" type="submit">Entrar</button>
    <button class="btn ghost wide" type="button" id="loginEsqueci">Esqueci minha senha</button>
  </form>
</div>

<div class="login-wrap" id="senha" style="display:none">
  <form class="login-box" id="senhaForm" autocomplete="off">
    <img src="assets/logo.jpg" alt="" class="login-logo">
    <h1>Defina sua senha</h1>
    <p class="login-sub" id="senhaSub">Crie uma senha para acessar a plataforma.</p>
    <label class="f"><span>Nova senha</span><input type="password" id="senhaNova" required minlength="6" autocomplete="new-password"></label>
    <label class="f"><span>Confirmar senha</span><input type="password" id="senhaConfirma" required minlength="6" autocomplete="new-password"></label>
    <p class="login-erro" id="senhaErro" hidden></p>
    <button class="btn wide" type="submit">Salvar e entrar</button>
  </form>
</div>

<div class="login-wrap" id="cadastro" style="display:none">
  <form class="login-box" id="cadastroForm" autocomplete="off">
    <img src="assets/logo.jpg" alt="" class="login-logo">
    <h1 id="cadastroTitulo">Bem-vindo(a)</h1>
    <p class="login-sub">Escolha seu e-mail e uma senha para criar seu acesso à plataforma.</p>
    <label class="f"><span>Seu e-mail</span><input type="email" id="cadastroEmail" required autocomplete="username"></label>
    <label class="f"><span>Crie uma senha</span><input type="password" id="cadastroSenha" required minlength="6" autocomplete="new-password"></label>
    <label class="f"><span>Confirmar senha</span><input type="password" id="cadastroConfirma" required minlength="6" autocomplete="new-password"></label>
    <p class="login-erro" id="cadastroErro" hidden></p>
    <button class="btn wide" type="submit">Criar acesso e entrar</button>
  </form>
</div>

<div class="shell is-open" id="shell" style="display:none">

  <header class="mobbar">
    <button class="mb-menu" id="menu" type="button" aria-label="Abrir menu" aria-expanded="false" aria-controls="side">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="mb-brand" href="#/"><img src="assets/logo.jpg" alt=""><b>Imperium</b></a>
  </header>

  <aside class="side" id="side">
    <div class="side-in">
      <a class="sd-brand" href="#/" aria-label="Imperium — início">
        <img src="assets/logo.jpg" alt="">
        <span><b>Imperium</b><small>Plataforma</small></span>
      </a>
      <nav class="sd-nav" id="nav" aria-label="Principal"></nav>
      <button class="sd-item sd-notificacoes" id="notificacoesBtn" type="button" hidden>
        <span class="sd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"/><path d="M10 21h4"/></svg></span>
        <span class="sd-lbl">Notificações</span>
      </button>
      <button class="sd-item sd-instalar" id="instalarBtn" type="button" hidden>
        <span class="sd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg></span>
        <span class="sd-lbl">Instalar aplicativo</span>
      </button>
      <button class="sd-item sd-sair" id="sairBtn" type="button">
        <span class="sd-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
        <span class="sd-lbl">Sair</span>
      </button>
    </div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <div class="viewwrap"><div id="view"></div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabase.js?v=2"></script>
<script src="js/dados.js?v=1"></script>
<script src="js/perfil.js?v=2"></script>
<script src="js/dashboard.js?v=11"></script>
<script src="js/platform.js?v=17"></script>
<script src="js/modules/propostas.js?v=26"></script>
<script src="js/modules/fluxo.js?v=10"></script>
<script src="js/modules/uniformes.js?v=16"></script>
<script src="js/modules/usuarios.js?v=6"></script>
<script src="js/modules/ponto.js?v=2"></script>
<script src="js/modules/clientes-relatorios.js?v=7"></script>
<script src="js/push.js?v=1"></script>
<script src="js/auth.js?v=9"></script>
<script src="js/pwa.js?v=1"></script>
</body>
</html>
