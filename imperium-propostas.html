<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Imperium — Gerador de Propostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0A0A09;
  --panel:#15130F;
  --panel-2:#1E1B16;
  --rule:#2F2A22;
  --gold:#D7B247;
  --gold-hi:#EFCC69;
  --cream:#F3EFE7;
  --muted:#9A9082;
  --paper:#FFFFFF;
  --paper-ink:#1D1C1A;
  --paper-rule:#D8D3C9;
  --field:#12100C;
  --ok:#5FA16B;
  --warn:#C98A2E;
  --rail:400px;
  --accent:#8A6A1E;
  --accent-hi:#A9822B;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ink);
  color:var(--cream);
  font-family:'Barlow',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- App shell ---------- */
.app{display:flex;min-height:100vh;align-items:stretch}
.rail{
  width:var(--rail);flex:0 0 var(--rail);
  background:var(--panel);
  border-right:1px solid var(--rule);
  height:100vh;position:sticky;top:0;overflow-y:auto;
}
.stage{flex:1;min-width:0;background:#08080720;background-image:
   linear-gradient(180deg,#0E0D0B,#080807);
  padding:26px 26px 80px;overflow-x:auto}

/* brand header */
.brand{display:flex;gap:12px;align-items:center;padding:18px 20px;border-bottom:1px solid var(--rule);position:sticky;top:0;background:var(--panel);z-index:5}
.brand img{width:44px;height:44px;border-radius:4px;display:block}
.brand h1{margin:0;font-family:'Oswald';font-weight:500;font-size:17px;letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.brand h1 span{display:block;font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:300}

/* sections in rail */
.sec{border-bottom:1px solid var(--rule)}
.sec>summary{
  list-style:none;cursor:pointer;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;
  font-family:'Oswald';font-weight:400;letter-spacing:.09em;text-transform:uppercase;font-size:13px;color:var(--cream);
}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--panel-2)}
.sec>summary .chev{color:var(--gold);font-size:11px;transition:transform .18s}
.sec[open]>summary .chev{transform:rotate(90deg)}
.sec .body{padding:4px 20px 20px}

label.f{display:block;margin:0 0 12px}
label.f>span{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
input[type=text],input[type=number],input[type=date],select,textarea{
  width:100%;background:var(--field);border:1px solid var(--rule);border-radius:3px;
  padding:9px 10px;color:var(--cream);
}
textarea{resize:vertical;min-height:70px;line-height:1.45}
input:hover,select:hover,textarea:hover{border-color:#453E33}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}

/* toggle list */
.tg{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #221F1A}
.tg:last-child{border-bottom:none}
.tg input{accent-color:var(--gold);width:16px;height:16px;flex:0 0 auto}
.tg span{font-size:14px}

/* cargo cards */
.cargo{border:1px solid var(--rule);border-radius:5px;margin-bottom:10px;background:#131109;overflow:hidden}
.cargo.on{border-color:#5B4B24;background:#191509}
.cargo .head{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;cursor:pointer}
.cargo .head input{accent-color:var(--gold);width:17px;height:17px;margin-top:2px;flex:0 0 auto}
.cargo .nm{flex:1;min-width:0}
.cargo .nm b{display:block;font-weight:600;font-size:14.5px;line-height:1.25}
.cargo .nm small{color:var(--muted);font-size:12px;letter-spacing:.04em}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:2px;margin-left:6px;vertical-align:1px}
.badge.chk{background:#1D3A22;color:#8FD39C}
.badge.ver{background:#3A2C10;color:#E0B45C}
.cargo .cfg{padding:0 12px 12px;display:none;border-top:1px dashed var(--rule);margin-top:2px;padding-top:12px}
.cargo.on .cfg{display:block}
.mini{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px}
.grid2 label.f,.grid3 label.f{margin:0}
.rm{background:none;border:1px solid var(--rule);color:var(--muted);border-radius:3px;padding:5px 9px;cursor:pointer;font-size:12px}
.rm:hover{border-color:#7A3B3B;color:#E59A9A}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--gold);color:#17130A;border:none;border-radius:3px;padding:11px 16px;
  font-family:'Oswald';font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:12.5px;cursor:pointer;
}
.btn:hover{background:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--cream);border:1px solid var(--rule)}
.btn.ghost:hover{background:var(--panel-2);border-color:#4A4235}
.btn.wide{width:100%}
.actions{padding:16px 20px;display:flex;flex-direction:column;gap:9px;position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--rule)}
.hint{font-size:12px;color:var(--muted);line-height:1.45;margin:8px 0 0}
.total-chip{display:flex;justify-content:space-between;align-items:baseline;padding:12px 14px;background:#191509;border:1px solid #5B4B24;border-radius:4px;margin-bottom:4px}
.total-chip small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.total-chip b{font-family:'Oswald';font-size:20px;color:var(--gold-hi);font-weight:500}

/* stage toolbar */
.stagebar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0 auto 18px;max-width:210mm}
.stagebar .zoom{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px}
.stagebar button{background:transparent;border:1px solid var(--rule);color:var(--cream);border-radius:3px;padding:6px 10px;cursor:pointer;font-size:13px}
.stagebar button:hover{border-color:var(--gold)}

/* ---------- Paper ---------- */
.papers{margin:0 auto;width:210mm;transform-origin:top center}
.paper{
  width:210mm;min-height:297mm;background:var(--paper);color:var(--paper-ink);
  margin:0 auto 22px;padding:16mm 15mm 20mm;position:relative;
  box-shadow:0 18px 40px rgba(0,0,0,.55);
  display:flex;flex-direction:column;
}
.paper .pfoot{
  position:absolute;left:0;right:0;bottom:0;background:#000;color:#fff;
  text-align:center;font-size:10.5pt;padding:6px 0;font-weight:600;letter-spacing:.01em;
}
.paper .pfoot a{color:#2F6BD8;text-decoration:underline}
.phead{display:flex;justify-content:flex-end;margin-bottom:10mm}

/* wordmark (CSS, para papel branco) */
.wm{display:inline-block;text-align:center;line-height:1}
.wm .w1{font-family:'Oswald';font-weight:500;letter-spacing:.14em;color:#C9A227;font-size:30px;display:block}
.wm .w2{font-family:'Oswald';font-weight:400;letter-spacing:.115em;font-size:10.5px;color:#111;display:block;border-top:2.5px solid #111;padding-top:2px;margin-top:1px}
.wm.sm .w1{font-size:21px}.wm.sm .w2{font-size:7.6px;border-top-width:2px}
.wm.lg .w1{font-size:58px;letter-spacing:.13em}.wm.lg .w2{font-size:20px;border-top-width:4px;padding-top:4px}

h2.dt{font-family:'Oswald';font-weight:500;font-size:23px;letter-spacing:.015em;margin:0 0 16px;color:#161512;position:relative;padding-bottom:10px}
h2.dt::after{content:"";position:absolute;left:0;bottom:0;width:38px;height:2px;background:var(--gold)}
h2.dt.center::after{left:50%;transform:translateX(-50%)}
h2.dt.noline{padding-bottom:0}
h2.dt.noline::after{display:none}
h3.dt{font-family:'Barlow';font-weight:700;font-size:15px;letter-spacing:.01em;margin:22px 0 8px;color:var(--accent)}
.paper p{margin:0 0 11px;text-align:justify;font-size:14px;line-height:1.58}
.lead{font-size:14.5px}
.motto{text-align:center;font-weight:600;font-style:italic;font-size:16.5px;color:var(--accent);margin:26px 0 22px;letter-spacing:.01em;position:relative;padding:0 0 14px}
.motto::after{content:"";position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:44px;height:1px;background:var(--gold)}
.cover-motto{
  background:#000;color:var(--gold);text-align:center;font-weight:700;font-size:19px;
  padding:14px 18px;border-radius:6px;border:2px solid var(--gold);margin:26px 0 0;
}
.cover{align-items:center;justify-content:flex-start;text-align:center}
.cover .site{font-size:16px;margin:18px 0 0;color:#222}
.cover .ttl{font-family:'Oswald';font-weight:600;font-size:40px;letter-spacing:.03em;margin:44px 0 10px}
.cover .sub{font-family:'Oswald';font-weight:500;font-size:19px;letter-spacing:.06em;color:#555;margin:0}
.svcgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px;width:100%}
.svcgrid div{
  border:1px solid #E4DFD3;border-radius:8px;padding:20px 10px 16px;font-weight:700;font-size:13px;line-height:1.3;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  box-shadow:0 2px 10px rgba(20,17,8,.05);background:#FFFDF9;
}
.svcgrid svg{width:26px;height:26px;flex:0 0 auto}
.svcgrid div em{display:block;font-style:normal;font-weight:400;font-size:10.5px;color:#8A8375;margin-top:1px;letter-spacing:.05em}
.cover-fill{flex:1;display:flex;align-items:flex-end;justify-content:center;width:100%;padding-top:26px}
.cover-orn{display:flex;align-items:center;gap:10px;color:#B7A257;width:100%;max-width:120mm}
.cover-orn .ln{flex:1;height:1px;background:linear-gradient(90deg,transparent,#D8C580,transparent)}
.cover-orn span{font-family:'Oswald';font-size:10.5px;letter-spacing:.28em;color:#8A8375;text-transform:uppercase;white-space:nowrap}

table.dt{width:100%;border-collapse:collapse;margin:8px 0 16px;font-size:12.5px}
table.dt th{background:#111;color:var(--gold);font-weight:600;padding:9px 8px;text-align:center;border:1px solid #111;letter-spacing:.03em}
table.dt td{border:1px solid #BEB8AC;padding:8px;text-align:center}
table.dt td.l{text-align:left}
table.dt tbody tr:nth-child(even) td{background:#FAF8F4}
table.dt .fn{font-weight:700;text-align:left}
.totrow td{background:#111 !important;color:#fff;font-weight:700;font-size:14px;border-color:#111}
.totrow td.v{color:var(--gold)}
.sup th{background:#111;color:var(--gold);border-color:#111}
.sup td.pil{font-weight:700;vertical-align:middle;color:#161512}
ul.dt{margin:6px 0 14px;padding-left:20px;font-size:14px}
ul.dt li{margin-bottom:7px;line-height:1.5}
ol.dt{margin:6px 0 16px;padding-left:24px;font-size:14.5px;font-weight:600}
ol.dt li{margin-bottom:5px}
.card-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6mm}
.card-box{border:1px solid #E4DFD3;border-top:3px solid var(--gold);border-radius:10px;padding:26px 22px 22px;background:#FFFDF9;box-shadow:0 3px 14px rgba(20,17,8,.05)}
.card-ico{width:42px;height:42px;border:1px solid #E4DFD3;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 14px}
.card-ico svg{width:20px;height:20px}
.card-box h4{font-family:'Oswald';font-weight:600;font-size:17px;text-align:center;margin:0 0 16px;letter-spacing:.015em}
.card-box ul{margin:0;padding-left:18px;font-size:13.5px}
.card-box li{margin-bottom:8px;line-height:1.4}
@media(max-width:1100px){.card-grid{grid-template-columns:1fr}}
.clientes{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;font-size:11px}
.clientes div{border:1px solid #E4DFD3;border-top:2px solid var(--gold);border-radius:6px;padding:14px 10px;text-align:center;background:#FFFDF9}
.clientes b{display:block;font-size:12.5px;margin:4px 0 3px;color:#161512}
.clientes em{font-style:normal;color:#9A9282;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase}
.clientes .foto{width:46px;height:46px;border-radius:6px;overflow:hidden;margin:0 auto 7px;display:flex;align-items:center;justify-content:center;background:#F7F4EC;border:1px solid #E4DFD3}
.clientes .foto img{width:100%;height:100%;object-fit:cover;display:block}
.clientes .foto.logo{background:#fff}
.clientes .foto.logo img{object-fit:contain;padding:3px}
.assin{margin-top:46px}
.assin .line{border-top:1px solid #111;width:62mm;margin-bottom:5px}
.mono-note{font-size:12.5px;color:#555}
.pill-note{background:#FBF6E6;border-left:3px solid var(--gold);padding:10px 12px;font-size:13px;margin:0 0 14px}

/* mobile */
.tabs{display:none}
@media (max-width:1100px){
  .app{flex-direction:column}
  .rail{width:100%;flex:none;height:auto;position:relative;border-right:none;border-bottom:1px solid var(--rule)}
  .stage{padding:16px 10px 60px}
  .papers{width:auto}
  .paper{width:100%;min-height:0;padding:22px 20px 56px;box-shadow:none;border-radius:6px}
  .stagebar{max-width:none}
  .svcgrid,.clientes{grid-template-columns:repeat(2,1fr)}
  table.dt{font-size:11px}
  .tabs{display:flex;position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:1px solid var(--rule)}
  .tabs button{flex:1;background:none;border:none;border-bottom:2px solid transparent;padding:13px;font-family:'Oswald';letter-spacing:.1em;text-transform:uppercase;font-size:12px;color:var(--muted);cursor:pointer}
  .tabs button.on{color:var(--gold);border-bottom-color:var(--gold)}
  body.m-prev .rail{display:none}
  body.m-edit .stage{display:none}
}

/* print */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .rail,.stagebar,.tabs{display:none !important}
  .stage{padding:0;background:#fff;overflow:visible}
  .papers{width:auto;transform:none !important}
  .paper{width:210mm;min-height:297mm;box-shadow:none;margin:0;page-break-after:always;break-after:page}
  .paper:last-child{page-break-after:auto;break-after:auto}
  table.dt,.card-box,.svcgrid{page-break-inside:avoid;break-inside:avoid}
}
</style>
</head>
<body class="m-edit">
<div class="tabs">
  <button data-tab="edit" class="on">Configurar</button>
  <button data-tab="prev">Visualizar</button>
</div>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <main class="stage">
    <div class="stagebar">
      <div class="zoom">Pré-visualização A4</div>
      <div>
        <button id="zout">−</button><button id="zin">+</button>
        <button id="print">Imprimir / salvar PDF</button>
      </div>
    </div>
    <div class="papers" id="papers"></div>
  </main>
</div>

/* ---------- persistência leve (rascunho local) ---------- */
function salvar(){ try{ localStorage.setItem("imperium_proposta", JSON.stringify(S)); }catch(e){} }
function carregar(){
  try{
    const raw = localStorage.getItem("imperium_proposta");
    if(!raw) return;
    const v = JSON.parse(raw);
    if(v && v.cargos){
      CATALOGO.forEach(c=>{ if(!v.cargos[c.id]) v.cargos[c.id]=novoCargo(c); });
      S = Object.assign(ESTADO_INICIAL(), v);
    }
  }catch(e){}
}

/* ---------- helpers ---------- */
const n2 = v => (Number(v)||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const brl = v => "R$ " + n2(v);
const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
function dataExt(iso){
  if(!iso) return "";
  const [a,m,d] = iso.split("-").map(Number);
  const nome = MES[(m||1)-1];
  return `${d} de ${nome.charAt(0).toUpperCase()+nome.slice(1)} de ${a}`;
}
function listaCargos(){
  const out=[];
  CATALOGO.forEach(c=>{ const x=S.cargos[c.id]; if(x&&x.on) out.push(Object.assign({id:c.id},x)); });
  S.extras.forEach((x,i)=>{ if(x.on) out.push(Object.assign({id:"x"+i},x)); });
  return out;
}
function nomeDoc(c){ return c.nome + (c.acum ? " com acúmulo de função" : ""); }
function remun(c){ return (+c.salario||0)+(+c.premio||0)+(+c.insal||0)+(+c.plr||0); }
function benef(c){ return ((+c.vr||0)+(+c.vt||0))*(+S.dias||0) + (+c.va||0); }
function totalMensal(){ return listaCargos().reduce((s,c)=>s+(+c.posto||0)*(+c.postos||0),0); }
function escopoAuto(){
  const f=[...new Set(listaCargos().map(c=>c.frente).filter(Boolean))];
  if(!f.length) return "limpeza e conservação";
  if(f.length===1) return f[0];
  return f.slice(0,-1).join(", ") + " e " + f[f.length-1];
}
function nomeCliente(){
  const t = S.tipoCliente==="Empresa" ? "" : (S.tipoCliente==="Residencial" ? "Residencial " : S.tipoCliente+" ");
  return (t + (S.cliente||"________")).trim();
}

function campo(label,tipo,path,attrs=""){
  return `<label class="f"><span>${label}</span><input type="${tipo}" data-p="${path}" ${attrs} value="${esc(get(path))}"></label>`;
}
function get(path){ return path.split(".").reduce((o,k)=>o?o[k]:"",S); }
function set(path,val){
  const ks=path.split("."); let o=S;
  for(let i=0;i<ks.length-1;i++) o=o[ks[i]];

}

function iconeCargo(c){
  const k = ((c.frente||"")+" "+(c.curto||"")+" "+(c.nome||"")).toLowerCase();
  let key="padrao";
  if(k.includes("jardin")) key="jardim";
  else if(k.includes("zelad")) key="zelad";
  else if(k.includes("porta")||k.includes("controlad")) key="portaria";
  else if(k.includes("recep")) key="recep";
  else if(k.includes("manut")) key="manuten";
  else if(k.includes("copeir")||k.includes("copa")) key="copa";
  else if(k.includes("mensag")) key="mensag";
  else if(k.includes("encarreg")||k.includes("supervis")) key="encarreg";
  else if(k.includes("limp")||k.includes("auxiliar")) key="limpeza";
  return `<svg viewBox="0 0 24 24" fill="none" stroke="#B8901F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICONE_SVG[key]}</svg>`;
}

/* ---------- eventos ---------- */
function refCargo(key){ return key.startsWith("x") ? S.extras[+key.slice(1)] : S.cargos[key]; }

document.addEventListener("input", e=>{
  const t = e.target;
  if(t.type==="checkbox") return;
  if(t.dataset.p){ let v=t.value; if(t.type==="number") v=parseFloat(v)||0; set(t.dataset.p,v); renderPapers(); return; }
  if(t.dataset.c){
    const [key,campo] = t.dataset.c.split(".");
    const o = refCargo(key); if(!o) return;
    o[campo] = t.type==="number" ? (parseFloat(t.value)||0) : t.value;
    renderPapers(); return;
  }
  if(t.dataset.d){
    const [i,campo] = t.dataset.d.split(".");
    S.difs[+i][campo] = t.value; renderPapers(); return;
  }
  if(t.dataset.cli){
    const [i,campo] = t.dataset.cli.split(".");
    S.clientes[+i][campo] = t.value; renderPapers(); return;
  }
});

document.addEventListener("change", e=>{
  const t = e.target;
  if(t.dataset.on!==undefined && t.type==="checkbox"){
    const o = refCargo(t.dataset.on); if(!o) return;
    o.on = t.checked;
    document.querySelector(`[data-card="${t.dataset.on}"]`).classList.toggle("on",t.checked);
    renderPapers(); return;
  }
  if(t.dataset.sec){ S.secoes[t.dataset.sec] = t.checked; renderPapers(); return; }
  if(t.dataset.clifoto!==undefined){
    const i = +t.dataset.clifoto;
    const file = t.files && t.files[0];
    if(!file) return;
    if(!/^image\//.test(file.type)){ alert("Selecione um arquivo de imagem."); t.value=""; return; }
    if(file.size > 4*1024*1024){ alert("Imagem muito grande (máx. 4MB)."); t.value=""; return; }
    const reader = new FileReader();
    reader.onload = () => {
      S.clientes[i].foto = reader.result;
      painel(); renderPapers();
    };
    reader.onerror = () => alert("Não foi possível ler essa imagem.");
    reader.readAsDataURL(file);
    return;
  }
  if(t.dataset.c && t.type==="checkbox"){
    const [k,campo]=t.dataset.c.split(".");
    const o=refCargo(k); if(o){ o[campo]=t.checked; renderPapers(); }
    return;
  }
  if(t.dataset.p && (t.tagName==="SELECT"||t.type==="date")){ set(t.dataset.p,t.value); renderPapers(); }
  if(t.dataset.c && t.tagName==="SELECT"){
    const [key,campo]=t.dataset.c.split(".");
    const o=refCargo(key); if(o){ o[campo]=t.value; renderPapers(); }
  }
});

document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.id==="addcargo"){
    S.extras.push(Object.assign(novoCargo(CATALOGO[0]),{on:true,nome:"Novo cargo",curto:"Novo cargo",cbo:"0000-00",conf:false,frente:"serviços gerais"}));
    painel(); renderPapers(); return;
  }
  if(b.dataset.del){ S.extras.splice(+b.dataset.del.slice(1),1); painel(); renderPapers(); return; }
  if(b.id==="adddif"){ S.difs.push({t:"Novo diferencial",d:""}); painel(); renderPapers(); return; }
  if(b.dataset.deldif){ S.difs.splice(+b.dataset.deldif,1); painel(); renderPapers(); return; }
  if(b.id==="addcli"){ S.clientes.push({t:"Empresa",n:"Nome do parceiro",c:"Campinas SP"}); painel(); renderPapers(); return; }
  if(b.dataset.delcli){ S.clientes.splice(+b.dataset.delcli,1); painel(); renderPapers(); return; }
  if(b.id==="print"||b.id==="print2"){ imprimir(); return; }
  if(b.id==="word"){ exportarWord(); return; }
  if(b.id==="zerar"){
    if(!confirm("Limpar todos os campos e começar uma proposta nova?")) return;
    S = ESTADO_INICIAL(); CATALOGO.forEach(c=>S.cargos[c.id]=novoCargo(c));
    painel(); renderPapers(); return;
  }
  if(b.id==="zin"||b.id==="zout"){
    zoom = Math.min(1.2,Math.max(0.5, zoom + (b.id==="zin"?0.1:-0.1)));
    const p=document.getElementById("papers");
    p.style.transform = `scale(${zoom})`;
    p.style.marginBottom = `${(zoom-1)*400}px`;
    return;
  }
  if(b.dataset.tab){
    document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    document.body.className = b.dataset.tab==="prev" ? "m-prev" : "m-edit";
    return;
  }
});


/* ---------- Exportação .docx ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c>>>0;}return t;})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipar(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  files.forEach(f=>{
    const nm=enc.encode(f.name), d=f.data, c=crc32(d);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true); lh.setUint16(4,20,true); lh.setUint16(6,0x0800,true);
    lh.setUint16(8,0,true); lh.setUint16(10,0,true); lh.setUint16(12,0,true);
    lh.setUint32(14,c,true); lh.setUint32(18,d.length,true); lh.setUint32(22,d.length,true);
    lh.setUint16(26,nm.length,true); lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true); ch.setUint16(4,20,true); ch.setUint16(6,20,true);
    ch.setUint16(8,0x0800,true); ch.setUint16(10,0,true); ch.setUint16(12,0,true); ch.setUint16(14,0,true);
    ch.setUint32(16,c,true); ch.setUint32(20,d.length,true); ch.setUint32(24,d.length,true);
    ch.setUint16(28,nm.length,true); ch.setUint16(30,0,true); ch.setUint16(32,0,true);
    ch.setUint16(34,0,true); ch.setUint16(36,0,true); ch.setUint32(38,0,true); ch.setUint32(42,off,true);
    cd.push(new Uint8Array(ch.buffer),nm);
    off += 30+nm.length+d.length;
  });
  let cdLen=0; cd.forEach(p=>cdLen+=p.length);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true); eo.setUint16(8,files.length,true); eo.setUint16(10,files.length,true);
  eo.setUint32(12,cdLen,true); eo.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(eo.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}

const X = s => String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function R(t,o){o=o||{};const sz=o.sz||21;return `<w:r><w:rPr>${o.b?"<w:b/>":""}${o.i?"<w:i/>":""}${o.color?`<w:color w:val="${o.color}"/>`:""}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${X(t)}</w:t></w:r>`;}
function P(rs,o){o=o||{};const runs=Array.isArray(rs)?rs.join(""):rs;
  return `<w:p><w:pPr>${o.align?`<w:jc w:val="${o.align}"/>`:""}${o.ind?`<w:ind w:left="${o.ind}"/>`:""}<w:spacing w:before="${o.before||0}" w:after="${o.after==null?120:o.after}" w:line="264" w:lineRule="auto"/></w:pPr>${runs}</w:p>`;}
const BRK = `<w:p><w:pPr><w:spacing w:after="0"/></w:pPr><w:r><w:br w:type="page"/></w:r></w:p>`;
function H(t,o){o=o||{};return P([R(t,{b:true,sz:o.sz||30,color:o.color||"111111"})],{before:200,after:120,align:o.align});}
function TD(t,o){o=o||{};
  const p=P([R(t,{b:o.b,sz:o.sz||19,color:o.color})],{align:o.align||"center",after:40});
  return `<w:tc><w:tcPr><w:tcW w:w="0" w:type="auto"/>${o.shade?`<w:shd w:val="clear" w:color="auto" w:fill="${o.shade}"/>`:""}${o.span?`<w:gridSpan w:val="${o.span}"/>`:""}${o.vm?`<w:vMerge w:val="${o.vm}"/>`:""}<w:vAlign w:val="center"/></w:tcPr>${p}</w:tc>`;}
const TR = cs => `<w:tr>${cs.join("")}</w:tr>`;
function TBL(rows){
  const b=["top","left","bottom","right","insideH","insideV"].map(s=>`<w:${s} w:val="single" w:sz="4" w:space="0" w:color="B9B3A7"/>`).join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="5000" w:type="pct"/><w:tblBorders>${b}</w:tblBorders><w:tblCellMar><w:top w:w="60" w:type="dxa"/><w:left w:w="80" w:type="dxa"/><w:bottom w:w="60" w:type="dxa"/><w:right w:w="80" w:type="dxa"/></w:tblCellMar></w:tblPr>${rows.join("")}</w:tbl>` + P([R("",{sz:12})],{after:0});
}

    P_.push(TBL(ln.map(l=>TR(l.map(c=>TD(c.t+" — "+c.n+" ("+c.c+")",{align:"left"}))
      .concat(Array(2-l.length).fill(TD(""))))))); 
    P_.push(H("QUEM SOMOS",{sz:20}));
    P_.push(P([R("Focamos no que é essencial para que você foque no seu negócio.",{b:true,sz:30})]));
    P_.push(P([R("A Imperium assume a gestão de atividades complementares com "),R("excelência e profissionalismo",{b:true}),R(".")]));
  }

  /* valores */
  const mediaBen = cs.length ? cs.reduce((s,c)=>s+benef(c),0)/cs.length : 0;
  P_.push(BRK, MARCA(), H("Da Proposta",{sz:40}));
  P_.push(P([R(S.base,{sz:24,color:"444444"})],{after:200}));

  P_.push(P([R("Remuneração da Colaboradora",{b:true})],{after:60}));
  P_.push(TBL([TR(["Função","Salário","Prêmio Assiduidade","Insalubridade Acúmulo","PLR anual","Total mensal"].map(t=>TD(t,{b:true,shade:"111111",color:"D7B247"})))]
    .concat(cs.map(c=>TR([TD(c.curto||c.nome,{b:true,align:"left"}),TD(brl(c.salario)),TD(brl(c.premio)),TD(brl(c.insal)),TD(brl(c.plr)),TD(brl(remun(c)))])))));

  P_.push(P([R("Benefícios mensais da Colaboradora",{b:true})],{after:60}));
  P_.push(TBL([TR(["Função","VR/ Dia","VT/ Dia","VA Cesta","Total"].map(t=>TD(t,{b:true,shade:"111111",color:"D7B247"})))]
    .concat(cs.map(c=>TR([TD(c.curto||c.nome,{b:true,align:"left"}),TD(brl(c.vr)),TD(brl(c.vt)),TD(brl(c.va)),TD(brl(benef(c)))])))));
  P_.push(P([R("Média mensal de benefícios por colaboradora: "+brl(mediaBen),{sz:19,color:"555555"})]));

  P_.push(P([R("Escopo e valores da proposta",{b:true})],{after:60}));
  P_.push(TBL([TR(["Função","Escala","Turno","Postos","Pessoas","Valor por posto","Valor total"].map(t=>TD(t,{b:true,shade:"111111",color:"D7B247"})))]
    .concat(cs.map(c=>TR([TD(c.curto||c.nome,{b:true,align:"left"}),TD(c.escala),TD(c.turno),TD(String(c.postos)),TD(String(c.func)),TD(brl(c.posto)),TD(brl((+c.posto||0)*(+c.postos||0)))])))
    .concat([TR([TD("Mensal",{b:true,span:6,align:"right",shade:"111111",color:"FFFFFF"}),TD(brl(totalMensal()),{b:true,shade:"111111",color:"D7B247"})])])));

  P_.push(H("Diferenciais e Condições da Proposta",{sz:24}));
  S.difs.forEach(d=>P_.push(BULLET(d.t,d.d)));

  /* aceite */
  if(S.secoes.aceite){
    P_.push(BRK, MARCA(), H("TERMO DE ACEITE",{sz:26}));
    P_.push(P([R("O "+(S.tipoCliente==="Empresa"?"":"Condomínio ")),R(nomeCliente(),{b:true}),R(" – "+S.localCliente+", com seu responsável legal faz o aceite da proposta da qual passará pelos ajustes jurídicos de contrato e após o início dos trabalhos conforme acertado entre as partes.")],{align:"both"}));
    P_.push(P([R("Valor mensal acordado: "),R(brl(totalMensal()),{b:true}),R(" — "+cs.reduce((s,c)=>s+(+c.postos||0),0)+" posto(s) de trabalho.")],{before:200}));
    P_.push(P([R(S.cidade+", "+dataExt(S.data),{color:"444444"})],{before:600}));
    P_.push(P([R("____________________________________")],{before:600,after:0}));
    P_.push(P([R(S.tratamento+" "+(S.responsavel||"________"))],{after:0}));
    P_.push(P([R(nomeCliente(),{b:true})]));
  }

  P_.push(P([R("www.imperiumservicos.com – CNPJ: 62.249.653.0001/66",{sz:18,color:"777777"})],{align:"center",before:400}));
  return P_.join("");
}

function docxBlob(){
  const enc=new TextEncoder();
  const doc = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>${docBody()}<w:sectPr><w:pgSz w:w="11906" w:h="16838"/><w:pgMar w:top="1134" w:right="1021" w:bottom="1134" w:left="1021" w:header="708" w:footer="708" w:gutter="0"/></w:sectPr></w:body></w:document>`;
  const ct = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  return zipar([
    {name:"[Content_Types].xml", data:enc.encode(ct)},
    {name:"_rels/.rels", data:enc.encode(rels)},
    {name:"word/document.xml", data:enc.encode(doc)}
  ]);
}

function nomeArquivo(){
  const base = "Proposta Imperium - " + (S.cliente || "cliente");
  return base.replace(/[\\/:*?"<>|]/g,"-").slice(0,120);
}

async function exportarWord(){
  const btn=document.getElementById("word"); const txt=btn?btn.textContent:"";
  try{
    if(btn){ btn.textContent="Gerando..."; btn.disabled=true; }
    const blob = docxBlob();
    const dl = (window.claude && window.claude.use) ? await window.claude.use("downloads") : null;
    if(!dl){
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download=nomeArquivo()+".docx"; document.body.appendChild(a); a.click();
      setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
      return;
    }
    await dl.save({filename:nomeArquivo()+".docx", data:blob});
  }catch(err){
    if(err && err.code!=="declined") alert("Não foi possível exportar: "+((err&&err.message)||(err&&err.code)||err));
  }finally{
    if(btn){ btn.textContent=txt||"Exportar para Word (.docx)"; btn.disabled=false; }
  }
}
