<!doctype html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confirme seu e-mail</title></head>
<body style="margin:0;padding:24px;background:#f3f3f3;font-family:Arial,Helvetica,sans-serif;color:#242424">
  <table role="presentation" style="width:100%;max-width:520px;margin:0 auto;border-collapse:collapse;background:#fff">
    <tr><td style="padding:26px 30px;background:#111;color:#d4b66e;font-size:20px;font-weight:bold;letter-spacing:3px">IMPERIUM</td></tr>
    <tr><td style="padding:30px">

      <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 24px;background:#111;color:#e1c47d;text-decoration:none;font-size:16px;font-weight:bold;border-radius:6px">Confirmar e-mail</a>
      <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#646464">Se você não solicitou este acesso, ignore esta mensagem.</p>
